<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <meta name="theme-color" content="#f6f4ef">
  <title>Git 命令练习台</title>
  <style>
    :root {
      --paper: #f6f4ef;
      --surface: #fffdf8;
      --ink: #172126;
      --muted: #687279;
      --line: #d8d5ca;
      --teal: #0b766e;
      --teal-soft: #d9ece7;
      --orange: #c9522a;
      --orange-soft: #f7dfd4;
      --yellow: #efc24d;
      --code: #16262b;
      --shadow: 0 14px 36px rgba(23, 33, 38, 0.08);
      --radius: 8px;
    }

    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      min-width: 320px;
      margin: 0;
      color: var(--ink);
      background:
        linear-gradient(rgba(23, 33, 38, 0.035) 1px, transparent 1px),
        linear-gradient(90deg, rgba(23, 33, 38, 0.035) 1px, transparent 1px),
        var(--paper);
      background-size: 28px 28px;
      font-family: "Aptos", "Segoe UI", "Microsoft YaHei", sans-serif;
      line-height: 1.55;
    }

    button,
    input {
      font: inherit;
    }

    button {
      color: inherit;
    }

    button:focus-visible,
    input:focus-visible,
    a:focus-visible {
      outline: 3px solid rgba(11, 118, 110, 0.28);
      outline-offset: 2px;
    }

    .topbar {
      position: sticky;
      z-index: 20;
      top: 0;
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      min-height: 64px;
      padding: 10px clamp(18px, 4vw, 56px);
      border-bottom: 1px solid rgba(216, 213, 202, 0.88);
      background: rgba(246, 244, 239, 0.92);
      backdrop-filter: blur(14px);
    }

    .brand {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      width: fit-content;
      color: var(--ink);
      font-family: "Cascadia Code", "SFMono-Regular", Consolas, monospace;
      font-size: 0.9rem;
      font-weight: 700;
      letter-spacing: 0;
      text-decoration: none;
    }

    .brand-mark {
      display: grid;
      width: 34px;
      height: 34px;
      place-items: center;
      border: 1px solid var(--ink);
      border-radius: 6px;
      background: var(--yellow);
      box-shadow: 3px 3px 0 var(--ink);
    }

    .brand-mark svg {
      width: 18px;
      height: 18px;
    }

    .repo-state {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 7px 11px;
      border: 1px solid var(--line);
      border-radius: 999px;
      color: var(--muted);
      background: var(--surface);
      font-size: 0.82rem;
      white-space: nowrap;
    }

    .state-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--teal);
      box-shadow: 0 0 0 4px var(--teal-soft);
    }

    .top-actions {
      display: flex;
      justify-content: flex-end;
    }

    .icon-button {
      display: grid;
      width: 38px;
      height: 38px;
      place-items: center;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: var(--surface);
      cursor: pointer;
      transition: background 160ms ease, border-color 160ms ease, transform 160ms ease;
    }

    .icon-button:hover {
      border-color: var(--orange);
      background: var(--orange-soft);
      transform: translateY(-1px);
    }

    .icon-button svg {
      width: 18px;
      height: 18px;
    }

    main {
      width: min(1220px, calc(100% - 36px));
      margin: 0 auto;
      padding: 52px 0 64px;
    }

    .overview {
      display: grid;
      grid-template-columns: minmax(0, 1.45fr) minmax(280px, 0.55fr);
      gap: clamp(28px, 6vw, 86px);
      align-items: end;
      margin-bottom: 38px;
    }

    .eyebrow {
      margin: 0 0 10px;
      color: var(--teal);
      font-family: "Cascadia Code", Consolas, monospace;
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    h1,
    h2,
    p {
      margin-top: 0;
    }

    h1 {
      max-width: 760px;
      margin-bottom: 14px;
      font-family: "Aptos Display", "Microsoft YaHei", sans-serif;
      font-size: clamp(2rem, 4.2vw, 4.3rem);
      line-height: 1.04;
      letter-spacing: -0.04em;
    }

    .lead {
      max-width: 660px;
      margin-bottom: 0;
      color: var(--muted);
      font-size: clamp(1rem, 1.6vw, 1.16rem);
    }

    .progress-panel {
      padding: 20px;
      border: 1px solid var(--ink);
      border-radius: var(--radius);
      background: var(--surface);
      box-shadow: var(--shadow);
    }

    .progress-head {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 14px;
    }

    .progress-head span {
      color: var(--muted);
      font-size: 0.9rem;
    }

    .progress-head strong {
      font-family: "Cascadia Code", Consolas, monospace;
      font-size: 1.15rem;
    }

    .progress-track {
      height: 9px;
      overflow: hidden;
      border: 1px solid var(--ink);
      border-radius: 999px;
      background: #e9e5dc;
    }

    .progress-bar {
      width: 0;
      height: 100%;
      background: var(--teal);
      transition: width 220ms ease;
    }

    .progress-note {
      margin: 12px 0 0;
      color: var(--muted);
      font-size: 0.84rem;
    }

    .workspace {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 320px;
      gap: 28px;
      align-items: start;
    }

    .toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      align-items: center;
      margin-bottom: 22px;
      padding: 12px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: rgba(255, 253, 248, 0.84);
    }

    .search-box {
      position: relative;
      flex: 1 1 280px;
    }

    .search-box svg {
      position: absolute;
      top: 50%;
      left: 13px;
      width: 18px;
      height: 18px;
      color: var(--muted);
      pointer-events: none;
      transform: translateY(-50%);
    }

    .search-box input {
      width: 100%;
      min-height: 42px;
      padding: 9px 14px 9px 41px;
      border: 1px solid var(--line);
      border-radius: 6px;
      color: var(--ink);
      background: var(--surface);
    }

    .search-box input::placeholder {
      color: #8c9498;
    }

    .segments {
      display: flex;
      gap: 4px;
      padding: 4px;
      border: 1px solid var(--line);
      border-radius: 7px;
      background: #eae7df;
    }

    .segment {
      min-height: 34px;
      padding: 6px 12px;
      border: 0;
      border-radius: 5px;
      color: var(--muted);
      background: transparent;
      cursor: pointer;
      transition: color 150ms ease, background 150ms ease, box-shadow 150ms ease;
    }

    .segment:hover {
      color: var(--ink);
    }

    .segment[aria-pressed="true"] {
      color: var(--ink);
      background: var(--surface);
      box-shadow: 0 2px 8px rgba(23, 33, 38, 0.09);
      font-weight: 700;
    }

    .list-head {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 20px;
      margin-bottom: 12px;
    }

    .list-head h2 {
      margin-bottom: 0;
      font-size: 1.05rem;
    }

    .visible-count {
      color: var(--muted);
      font-family: "Cascadia Code", Consolas, monospace;
      font-size: 0.78rem;
    }

    .command-list {
      display: grid;
      gap: 10px;
    }

    .command-card {
      display: grid;
      grid-template-columns: auto minmax(0, 1fr) auto;
      gap: 14px;
      align-items: start;
      padding: 16px;
      border: 1px solid var(--line);
      border-left: 4px solid var(--yellow);
      border-radius: var(--radius);
      background: var(--surface);
      transition: border-color 160ms ease, box-shadow 160ms ease, transform 160ms ease;
    }

    .command-card:hover {
      border-color: #a9aaa3;
      border-left-color: var(--orange);
      box-shadow: 0 10px 24px rgba(23, 33, 38, 0.07);
      transform: translateY(-1px);
    }

    .command-card.is-done {
      border-left-color: var(--teal);
      background: #fbfdfa;
    }

    .check-button,
    .copy-button {
      display: grid;
      place-items: center;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: #f4f1ea;
      cursor: pointer;
      transition: color 150ms ease, background 150ms ease, border-color 150ms ease;
    }

    .check-button {
      width: 36px;
      height: 36px;
    }

    .copy-button {
      width: 38px;
      height: 38px;
    }

    .check-button:hover,
    .copy-button:hover {
      border-color: var(--teal);
      color: var(--teal);
      background: var(--teal-soft);
    }

    .command-card.is-done .check-button {
      border-color: var(--teal);
      color: white;
      background: var(--teal);
    }

    .check-button svg,
    .copy-button svg {
      width: 18px;
      height: 18px;
    }

    .command-meta {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
      margin-bottom: 8px;
    }

    .category {
      padding: 2px 7px;
      border: 1px solid var(--line);
      border-radius: 4px;
      color: var(--muted);
      background: #f0ede6;
      font-size: 0.7rem;
      font-weight: 700;
    }

    .command-title {
      font-size: 0.94rem;
      font-weight: 700;
    }

    .command-code {
      display: inline-block;
      max-width: 100%;
      padding: 7px 10px;
      overflow-x: auto;
      border-radius: 5px;
      color: #e9f3f1;
      background: var(--code);
      font-family: "Cascadia Code", "SFMono-Regular", Consolas, monospace;
      font-size: 0.86rem;
      white-space: nowrap;
    }

    .command-note {
      margin: 9px 0 0;
      color: var(--muted);
      font-size: 0.86rem;
    }

    .sidebar {
      position: sticky;
      top: 88px;
      display: grid;
      gap: 18px;
    }

    .side-panel {
      padding: 18px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--surface);
    }

    .side-title {
      display: flex;
      align-items: center;
      gap: 9px;
      margin-bottom: 14px;
    }

    .side-title svg {
      width: 18px;
      height: 18px;
      color: var(--orange);
    }

    .side-title h2 {
      margin: 0;
      font-size: 0.95rem;
    }

    .branch-graph {
      width: 100%;
      height: auto;
      border: 1px solid #e3dfd6;
      border-radius: 6px;
      background: #f9f7f2;
    }

    .graph-legend {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-top: 12px;
      color: var(--muted);
      font-family: "Cascadia Code", Consolas, monospace;
      font-size: 0.74rem;
    }

    .legend-item {
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .legend-line {
      width: 15px;
      height: 3px;
      border-radius: 999px;
      background: var(--teal);
    }

    .legend-line.orange {
      background: var(--orange);
    }

    .roadmap {
      display: grid;
      gap: 0;
      margin: 0;
      padding: 0;
      list-style: none;
    }

    .roadmap li {
      position: relative;
      display: grid;
      grid-template-columns: 24px 1fr;
      gap: 10px;
      min-height: 48px;
      color: var(--muted);
      font-size: 0.88rem;
    }

    .roadmap li:not(:last-child)::after {
      position: absolute;
      top: 24px;
      bottom: 0;
      left: 11px;
      width: 1px;
      background: var(--line);
      content: "";
    }

    .roadmap-dot {
      z-index: 1;
      display: grid;
      width: 23px;
      height: 23px;
      place-items: center;
      border: 1px solid var(--line);
      border-radius: 50%;
      background: var(--surface);
      font-family: "Cascadia Code", Consolas, monospace;
      font-size: 0.68rem;
    }

    .roadmap li.done {
      color: var(--ink);
      font-weight: 700;
    }

    .roadmap li.done .roadmap-dot {
      border-color: var(--teal);
      color: white;
      background: var(--teal);
    }

    .roadmap li.current .roadmap-dot {
      border-color: var(--orange);
      color: white;
      background: var(--orange);
      box-shadow: 0 0 0 4px var(--orange-soft);
    }

    .empty-state {
      padding: 32px 20px;
      border: 1px dashed var(--line);
      border-radius: var(--radius);
      color: var(--muted);
      background: rgba(255, 253, 248, 0.72);
      text-align: center;
    }

    .toast {
      position: fixed;
      z-index: 40;
      right: 22px;
      bottom: 22px;
      max-width: min(360px, calc(100vw - 44px));
      padding: 11px 14px;
      border: 1px solid var(--ink);
      border-radius: 6px;
      color: white;
      background: var(--ink);
      box-shadow: 0 12px 32px rgba(23, 33, 38, 0.2);
      font-size: 0.86rem;
      opacity: 0;
      pointer-events: none;
      transform: translateY(10px);
      transition: opacity 180ms ease, transform 180ms ease;
    }

    .toast.is-visible {
      opacity: 1;
      transform: translateY(0);
    }

    @media (max-width: 920px) {
      .overview,
      .workspace {
        grid-template-columns: 1fr;
      }

      .sidebar {
        position: static;
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
    }

    @media (max-width: 680px) {
      .topbar {
        grid-template-columns: 1fr auto;
      }

      .repo-state {
        display: none;
      }

      main {
        width: min(100% - 24px, 1220px);
        padding-top: 34px;
      }

      .overview {
        margin-bottom: 28px;
      }

      h1 {
        letter-spacing: -0.03em;
      }

      .toolbar {
        align-items: stretch;
      }

      .segments {
        width: 100%;
        overflow-x: auto;
      }

      .segment {
        flex: 1 0 auto;
      }

      .command-card {
        grid-template-columns: auto minmax(0, 1fr);
      }

      .copy-button {
        grid-column: 2;
        justify-self: end;
      }

      .sidebar {
        grid-template-columns: 1fr;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        scroll-behavior: auto !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="#top" aria-label="返回页面顶部">
      <span class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="m4 17 6-6-6-6"></path>
          <path d="M12 19h8"></path>
        </svg>
      </span>
      <span>git.workbench</span>
    </a>

    <div class="repo-state">
      <span class="state-dot" aria-hidden="true"></span>
      本地练习仓库
    </div>

    <div class="top-actions">
      <button class="icon-button" id="resetButton" type="button" title="清除练习进度" aria-label="清除练习进度">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M3 6h18"></path>
          <path d="M8 6V4h8v2"></path>
          <path d="m19 6-1 14H6L5 6"></path>
          <path d="M10 11v6"></path>
          <path d="M14 11v6"></path>
        </svg>
      </button>
    </div>
  </header>

  <main id="top">
    <section class="overview" aria-labelledby="pageTitle">
      <div>
        <p class="eyebrow">Command Practice</p>
        <h1 id="pageTitle">把 Git 命令练成手感</h1>
        <p class="lead">从初始化、提交到分支与修复，集中熟悉日常开发中最常用的 Git 操作。</p>
      </div>

      <div class="progress-panel" aria-label="练习进度">
        <div class="progress-head">
          <span>完成进度</span>
          <strong id="progressText">0 / 0</strong>
        </div>
        <div class="progress-track" aria-hidden="true">
          <div class="progress-bar" id="progressBar"></div>
        </div>
        <p class="progress-note" id="progressNote">从一条命令开始。</p>
      </div>
    </section>

    <div class="workspace">
      <section aria-labelledby="listTitle">
        <div class="toolbar">
          <label class="search-box">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <circle cx="11" cy="11" r="8"></circle>
              <path d="m21 21-4.3-4.3"></path>
            </svg>
            <input id="searchInput" type="search" placeholder="搜索命令或说明" autocomplete="off" aria-label="搜索命令或说明">
          </label>

          <div class="segments" role="group" aria-label="按类别筛选">
            <button class="segment" type="button" data-category="all" aria-pressed="true">全部</button>
            <button class="segment" type="button" data-category="basic" aria-pressed="false">基础</button>
            <button class="segment" type="button" data-category="branch" aria-pressed="false">分支</button>
            <button class="segment" type="button" data-category="repair" aria-pressed="false">修复</button>
          </div>
        </div>

        <div class="list-head">
          <h2 id="listTitle">练习命令</h2>
          <span class="visible-count" id="visibleCount"></span>
        </div>

        <div class="command-list" id="commandList"></div>
      </section>

      <aside class="sidebar" aria-label="仓库概览">
        <section class="side-panel">
          <div class="side-title">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <circle cx="6" cy="6" r="3"></circle>
              <circle cx="18" cy="6" r="3"></circle>
              <circle cx="12" cy="18" r="3"></circle>
              <path d="M6 9v2c0 2 2 4 4 4h1"></path>
              <path d="M18 9v1c0 3-2 5-5 5h-1"></path>
            </svg>
            <h2>分支路径</h2>
          </div>

          <svg class="branch-graph" viewBox="0 0 420 190" role="img" aria-label="包含 main、feature 与修复提交的分支示意图">
            <g fill="none" stroke-linecap="round" stroke-width="8">
              <path d="M52 48V154" stroke="#0b766e"></path>
              <path d="M52 82C112 82 112 48 172 48H365" stroke="#c9522a"></path>
              <path d="M52 118C112 118 120 154 180 154H295" stroke="#0b766e"></path>
              <path d="M295 154C338 154 350 128 365 116" stroke="#efc24d"></path>
            </g>
            <g fill="#fffdf8" stroke="#172126" stroke-width="4">
              <circle cx="52" cy="48" r="10"></circle>
              <circle cx="52" cy="82" r="10"></circle>
              <circle cx="52" cy="118" r="10"></circle>
              <circle cx="52" cy="154" r="10"></circle>
              <circle cx="172" cy="48" r="10"></circle>
              <circle cx="365" cy="48" r="10"></circle>
              <circle cx="180" cy="154" r="10"></circle>
              <circle cx="295" cy="154" r="10"></circle>
            </g>
            <g fill="#172126" font-family="Cascadia Code, Consolas, monospace" font-size="12">
              <text x="20" y="25">master</text>
              <text x="188" y="28">feature</text>
              <text x="205" y="181">merge</text>
            </g>
          </svg>

          <div class="graph-legend" aria-hidden="true">
            <span class="legend-item"><span class="legend-line"></span>master</span>
            <span class="legend-item"><span class="legend-line orange"></span>feature</span>
          </div>
        </section>

        <section class="side-panel">
          <div class="side-title">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M9 11l3 3L22 4"></path>
              <path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"></path>
            </svg>
            <h2>仓库路线</h2>
          </div>

          <ol class="roadmap">
            <li class="done">
              <span class="roadmap-dot">01</span>
              <span>初始化本地仓库</span>
            </li>
            <li class="done">
              <span class="roadmap-dot">02</span>
              <span>编写 README</span>
            </li>
            <li class="current">
              <span class="roadmap-dot">03</span>
              <span>创建首次提交</span>
            </li>
            <li>
              <span class="roadmap-dot">04</span>
              <span>连接远程仓库</span>
            </li>
          </ol>
        </section>
      </aside>
    </div>
  </main>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script>
    const commands = [
      {
        id: "init",
        category: "basic",
        categoryLabel: "基础",
        title: "初始化仓库",
        code: "git init",
        note: "在当前目录创建本地 Git 仓库。"
      },
      {
        id: "status",
        category: "basic",
        categoryLabel: "基础",
        title: "查看状态",
        code: "git status",
        note: "检查工作区、暂存区和当前分支状态。"
      },
      {
        id: "add",
        category: "basic",
        categoryLabel: "基础",
        title: "暂存修改",
        code: "git add .",
        note: "把当前目录下的变化加入暂存区。"
      },
      {
        id: "commit",
        category: "basic",
        categoryLabel: "基础",
        title: "创建提交",
        code: 'git commit -m "描述本次修改"',
        note: "把暂存区中的内容保存为一次提交。"
      },
      {
        id: "log",
        category: "basic",
        categoryLabel: "基础",
        title: "查看历史",
        code: "git log --oneline --graph --decorate",
        note: "用简洁图形查看提交历史与引用位置。"
      },
      {
        id: "switch-new",
        category: "branch",
        categoryLabel: "分支",
        title: "新建并切换分支",
        code: "git switch -c feature/readme",
        note: "从当前提交创建特性分支并立即切换。"
      },
      {
        id: "switch-main",
        category: "branch",
        categoryLabel: "分支",
        title: "切换回主分支",
        code: "git switch master",
        note: "返回 master 分支继续工作。"
      },
      {
        id: "merge",
        category: "branch",
        categoryLabel: "分支",
        title: "合并分支",
        code: "git merge feature/readme",
        note: "把特性分支合并到当前分支。"
      },
      {
        id: "delete-branch",
        category: "branch",
        categoryLabel: "分支",
        title: "删除已合并分支",
        code: "git branch -d feature/readme",
        note: "删除已经完成合并的本地分支。"
      },
      {
        id: "diff",
        category: "repair",
        categoryLabel: "修复",
        title: "查看未暂存改动",
        code: "git diff",
        note: "逐行查看工作区中尚未暂存的修改。"
      },
      {
        id: "restore-file",
        category: "repair",
        categoryLabel: "修复",
        title: "放弃文件修改",
        code: "git restore <file>",
        note: "把指定文件恢复到最近一次提交的状态。"
      },
      {
        id: "unstage",
        category: "repair",
        categoryLabel: "修复",
        title: "撤出暂存区",
        code: "git restore --staged <file>",
        note: "保留文件内容，只取消暂存状态。"
      },
      {
        id: "soft-reset",
        category: "repair",
        categoryLabel: "修复",
        title: "撤销最近一次提交",
        code: "git reset --soft HEAD~1",
        note: "回退一次提交记录，同时保留所有改动。"
      },
      {
        id: "reflog",
        category: "repair",
        categoryLabel: "修复",
        title: "查看引用记录",
        code: "git reflog",
        note: "追踪 HEAD 移动记录，用于找回误操作后的提交。"
      }
    ];

    const storageKey = "git-workbench-progress-v1";
    const completed = new Set(loadProgress());

    const list = document.querySelector("#commandList");
    const searchInput = document.querySelector("#searchInput");
    const visibleCount = document.querySelector("#visibleCount");
    const progressText = document.querySelector("#progressText");
    const progressBar = document.querySelector("#progressBar");
    const progressNote = document.querySelector("#progressNote");
    const resetButton = document.querySelector("#resetButton");
    const toast = document.querySelector("#toast");
    const segmentButtons = Array.from(document.querySelectorAll(".segment"));

    let activeCategory = "all";
    let toastTimer;

    function loadProgress() {
      try {
        const value = JSON.parse(localStorage.getItem(storageKey) || "[]");
        return Array.isArray(value) ? value : [];
      } catch {
        return [];
      }
    }

    function saveProgress() {
      try {
        localStorage.setItem(storageKey, JSON.stringify(Array.from(completed)));
      } catch {
        return;
      }
    }

    function icon(name) {
      const icons = {
        check: '<path d="M20 6 9 17l-5-5"></path>',
        copy: '<rect width="14" height="14" x="8" y="8" rx="2" ry="2"></rect><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"></path>'
      };

      return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${icons[name]}</svg>`;
    }

    function renderCommands() {
      const query = searchInput.value.trim().toLowerCase();
      const filtered = commands.filter((item) => {
        const matchesCategory = activeCategory === "all" || item.category === activeCategory;
        const searchable = `${item.title} ${item.code} ${item.note} ${item.categoryLabel}`.toLowerCase();
        return matchesCategory && searchable.includes(query);
      });

      if (!filtered.length) {
        list.innerHTML = '<div class="empty-state">没有找到匹配的命令。</div>';
      } else {
        list.innerHTML = filtered.map((item) => {
          const done = completed.has(item.id);
          return `
            <article class="command-card${done ? " is-done" : ""}" data-id="${item.id}">
              <button class="check-button" type="button" data-action="toggle" title="${done ? "标记为未完成" : "标记为已完成"}" aria-label="${done ? "标记为未完成" : "标记为已完成"}" aria-pressed="${done}">
                ${icon("check")}
              </button>
              <div>
                <div class="command-meta">
                  <span class="category">${item.categoryLabel}</span>
                  <span class="command-title">${item.title}</span>
                </div>
                <code class="command-code">${item.code}</code>
                <p class="command-note">${item.note}</p>
              </div>
              <button class="copy-button" type="button" data-action="copy" title="复制命令" aria-label="复制命令">
                ${icon("copy")}
              </button>
            </article>
          `;
        }).join("");
      }

      visibleCount.textContent = `${filtered.length} 条`;
      updateProgress();
    }

    function updateProgress() {
      const total = commands.length;
      const done = completed.size;
      const percent = total ? Math.round((done / total) * 100) : 0;

      progressText.textContent = `${done} / ${total}`;
      progressBar.style.width = `${percent}%`;

      if (done === 0) {
        progressNote.textContent = "从一条命令开始。";
      } else if (done === total) {
        progressNote.textContent = "全部命令已完成。";
      } else {
        progressNote.textContent = `已完成 ${percent}% 的练习。`;
      }
    }

    function showToast(message) {
      window.clearTimeout(toastTimer);
      toast.textContent = message;
      toast.classList.add("is-visible");
      toastTimer = window.setTimeout(() => {
        toast.classList.remove("is-visible");
      }, 1800);
    }

    async function copyText(value) {
      if (navigator.clipboard && window.isSecureContext) {
        await navigator.clipboard.writeText(value);
        return;
      }

      const field = document.createElement("textarea");
      field.value = value;
      field.setAttribute("readonly", "");
      field.style.position = "fixed";
      field.style.opacity = "0";
      document.body.appendChild(field);
      field.select();
      document.execCommand("copy");
      field.remove();
    }

    list.addEventListener("click", async (event) => {
      const button = event.target.closest("button[data-action]");
      if (!button) {
        return;
      }

      const card = button.closest(".command-card");
      const item = commands.find((command) => command.id === card.dataset.id);

      if (button.dataset.action === "toggle") {
        if (completed.has(item.id)) {
          completed.delete(item.id);
          showToast(`已取消：${item.title}`);
        } else {
          completed.add(item.id);
          showToast(`已完成：${item.title}`);
        }
        saveProgress();
        renderCommands();
        return;
      }

      try {
        await copyText(item.code);
        showToast(`已复制：${item.code}`);
      } catch {
        showToast("复制失败，请手动选择命令。");
      }
    });

    searchInput.addEventListener("input", renderCommands);

    segmentButtons.forEach((button) => {
      button.addEventListener("click", () => {
        activeCategory = button.dataset.category;
        segmentButtons.forEach((item) => {
          item.setAttribute("aria-pressed", String(item === button));
        });
        renderCommands();
      });
    });

    resetButton.addEventListener("click", () => {
      if (!completed.size) {
        showToast("当前没有需要清除的进度。");
        return;
      }

      if (!window.confirm("确定清除全部练习进度吗？")) {
        return;
      }

      completed.clear();
      saveProgress();
      renderCommands();
      showToast("练习进度已清除。");
    });

    renderCommands();
  </script>
</body>
</html>
